<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 240" role="img" aria-labelledby="olive-title olive-desc">
  <title id="olive-title">Olea europaea · rama con hojas opuestas</title>
  <desc id="olive-desc">Tres pares de hojas lanceoladas de margen entero, insertadas frente a frente en los mismos nudos. La perspectiva alterna entre pares; sus ápices se orientan hacia el extremo de la rama. Una aceituna cuelga de un pedicelo axilar y una yema cierra el brote.</desc>
  <defs>
    <linearGradient id="blade" x1="-9" y1="-40" x2="9" y2="-40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#203e2e"/><stop offset=".34" stop-color="#426a46"/><stop offset=".52" stop-color="#69845b"/><stop offset=".59" stop-color="#4d704b"/><stop offset="1" stop-color="#2a4b36"/>
    </linearGradient>
    <linearGradient id="bark" x1="86" y1="130" x2="122" y2="135" gradientUnits="userSpaceOnUse">
      <stop stop-color="#777751"/><stop offset=".5" stop-color="#a7a581"/><stop offset="1" stop-color="#6b7951"/>
    </linearGradient>
    <radialGradient id="olive-green" cx="32%" cy="25%" r="83%">
      <stop stop-color="#a8ae65"/><stop offset=".25" stop-color="#7f9455"/><stop offset=".64" stop-color="#4e6d3d"/><stop offset="1" stop-color="#2a4933"/>
    </radialGradient>
    <radialGradient id="olive-dark" cx="29%" cy="25%" r="90%">
      <stop stop-color="#758a58"/><stop offset=".45" stop-color="#456343"/><stop offset="1" stop-color="#203b2d"/>
    </radialGradient>
    <g id="leaf-blade">
      <path d="M0 0 Q-.4-3 0-7" fill="none" stroke="#7c8b5d" stroke-width="1.25" stroke-linecap="round"/>
      <path d="M0-6 C-3-12-7.4-28-7.6-43 C-7.8-59-3.6-75 0-85 C3.2-75 7.5-58 7.6-44 C7.9-29 3.1-13 0-6Z" fill="url(#blade)" stroke="#294e37" stroke-width=".45"/>
      <path d="M0-8 C-.6-28 .8-58 0-83" fill="none" stroke="#b8c0a0" stroke-width=".7" opacity=".72"/>
      <g fill="none" stroke="#a0b08a" stroke-width=".42" opacity=".38">
        <path d="M0-20 Q-3-23-4.3-27 M0-29 Q-4-33-6.2-38 M0-39 Q-4-43-6.7-49 M0-49 Q-3-54-5.6-60 M0-60 Q-2-64-3.6-70"/>
        <path d="M0-22 Q3-25 4.6-30 M0-32 Q4-36 6.3-41 M0-42 Q4-46 6.5-52 M0-53 Q3-57 5-63 M0-63 Q2-67 3-72"/>
      </g>
      <path d="M1.3-13 C4.6-31 5.9-50 2.1-74" fill="none" stroke="#c5c9ad" stroke-width="1.3" opacity=".09"/>
    </g>
    <g id="olive-fruit">
      <path d="M-1-17 C8-18 13-10 12 0 C11 11 7 18 0 19 C-8 18-12 10-12 0 C-12-10-8-17-1-17Z" fill="url(#olive-green)"/>
      <path d="M-5-12 C-9-7-9 0-7 5" fill="none" stroke="#e1dfaa" stroke-width="2" stroke-linecap="round" opacity=".2"/>
      <g fill="#d5d5a0" opacity=".32"><circle cx="-4" cy="-7" r=".45"/><circle cx="4" cy="-9" r=".35"/><circle cx="6" cy="-2" r=".45"/><circle cx="-5" cy="3" r=".38"/><circle cx="3" cy="8" r=".4"/><circle cx="0" cy="13" r=".3"/></g>
      <path d="M-4-16 L-2-18 L0-17 L2-19 L4-16 L1-15Z" fill="#566e41"/>
    </g>
  </defs>
  <style>
    .olive-twig { transform-origin:84px 220px; animation:olive-breeze 9s ease-in-out infinite; }
    @keyframes olive-breeze { 0%,100% {transform:rotate(-1deg)} 50% {transform:rotate(1.1deg)} }
    @media(prefers-reduced-motion:reduce) { .olive-twig {animation:none} }
  </style>
  <ellipse cx="101" cy="126" rx="94" ry="108" fill="#f7f7f0" fill-opacity=".98"/>
  <path d="M28 179 C15 154 18 113 31 90" fill="none" stroke="#d1bc83" stroke-width=".85" opacity=".65" stroke-linecap="round"/>
  <g class="olive-twig">
    <path d="M84 220 C88 206 92 189 94 178 C99 160 103 143 107 128 C111 109 115 93 118 80 C122 59 125 39 128 21" fill="none" stroke="url(#bark)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M85 218 C96 184 102 153 108 128 C116 96 123 56 127 27" fill="none" stroke="#c4bea0" stroke-width=".65" opacity=".6"/>

    <g class="opposite-pair" id="pair-lower" data-node="94,178" transform="translate(94 178)">
      <path d="M-2 1 Q0-1 2 1" fill="none" stroke="#788c60" stroke-width="2.1" stroke-linecap="round"/>
      <g class="leaf-left" transform="rotate(-44) scale(0.94 0.9)"><use xlink:href="#leaf-blade"/></g>
      <g class="leaf-right" transform="rotate(44) scale(0.94 0.9)"><use xlink:href="#leaf-blade"/></g>
    </g>
    <g class="opposite-pair" id="pair-middle" data-node="107,128" transform="translate(107 128)">
      <path d="M-2 1 Q0-1 2 1" fill="none" stroke="#788c60" stroke-width="2.1" stroke-linecap="round"/>
      <g class="leaf-left" transform="rotate(-65) scale(0.64 0.88)"><use xlink:href="#leaf-blade"/></g>
      <g class="leaf-right" transform="rotate(65) scale(0.64 0.88)"><use xlink:href="#leaf-blade"/></g>
    </g>
    <g class="opposite-pair" id="pair-upper" data-node="118,80" transform="translate(118 80)">
      <path d="M-2 1 Q0-1 2 1" fill="none" stroke="#788c60" stroke-width="2.1" stroke-linecap="round"/>
      <g class="leaf-left" transform="rotate(-45) scale(0.84 0.76)"><use xlink:href="#leaf-blade"/></g>
      <g class="leaf-right" transform="rotate(45) scale(0.84 0.76)"><use xlink:href="#leaf-blade"/></g>
    </g>
    <!-- Opposite bud scales at the apex; no solitary terminal leaf. -->
    <g transform="translate(128 24) rotate(7)">
      <path d="M0 2 C-3 0-4-3-2-7 C1-6 2-1 0 2Z" fill="#89916a"/>
      <path d="M0 2 C3 1 4-2 3-6 C0-5-1-1 0 2Z" fill="#636d49"/>
      <path d="M-2-3 Q0-2 2-4" fill="none" stroke="#a5a47c" stroke-width=".6"/>
    </g>
    <!-- The single fruit pedicel originates in the lower leaf axil. -->
    <g class="axillary-fruits" data-node="94,178">
      <path d="M94 178 C108 177 120 185 127 197" fill="none" stroke="#87935d" stroke-width="1.35" stroke-linecap="round"/>
      <g transform="translate(132 213) rotate(-15)"><use xlink:href="#olive-fruit"/></g>
    </g>
  </g>
</svg>